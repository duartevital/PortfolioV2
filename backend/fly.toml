app = 'vital-photography-api'
primary_region = 'mad'   # Madrid — closest to Portugal; change if you prefer another region

[build]
  dockerfile = 'Dockerfile'

[env]
  ASPNETCORE_ENVIRONMENT = 'Production'
  Jwt__Issuer            = 'vital-photography'
  Jwt__Audience          = 'vital-photography-admin'
  Jwt__ExpiryMinutes     = '60'

# Secrets (set via `fly secrets set KEY=value` — never committed):
#   Jwt__Secret
#   Admin__PasswordHash
#   CloudflareR2__AccountId
#   CloudflareR2__AccessKeyId
#   CloudflareR2__SecretAccessKey
#   CloudflareR2__BucketName
#   CloudflareR2__PublicUrl
#   Cors__AllowedOrigins    (your Vercel URL, e.g. https://your-app.vercel.app)

[http_service]
  internal_port        = 8080
  force_https          = true
  auto_stop_machines   = 'stop'
  auto_start_machines  = true
  min_machines_running = 0

[[mounts]]
  source      = 'vital_photography_data'
  destination = '/data'
  initial_size = '1gb'

[[vm]]
  cpu_kind = 'shared'
  cpus     = 1
  memory   = '256mb'
