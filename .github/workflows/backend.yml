name: Backend — CI

# Verifies the build on every push so broken code is caught early.

on:
  push:
    branches: [main]
    paths: [backend/**]
  pull_request:
    branches: [main]
    paths: [backend/**]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.x

      - run: dotnet restore backend/VitalPhotography.sln
      - run: dotnet build   backend/VitalPhotography.sln --no-restore -c Release
