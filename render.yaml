services:
  - type: web
    name: vital-photography-api
    runtime: docker
    rootDir: backend
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: ConnectionStrings__DefaultConnection
        value: "Data Source=/data/vital-photography.db"
      - key: Storage__Root
        value: /data/uploads
      - key: Jwt__Issuer
        value: vital-photography
      - key: Jwt__Audience
        value: vital-photography-admin
      - key: Jwt__ExpiryMinutes
        value: "60"
      # Set these in the Render dashboard — never commit real values:
      - key: Jwt__Secret
        sync: false
      - key: Admin__PasswordHash
        sync: false
      - key: Cors__AllowedOrigins
        sync: false

    disk:
      name: data
      mountPath: /data
      sizeGB: 1    # $0.25/month — holds SQLite db + all uploaded photos
